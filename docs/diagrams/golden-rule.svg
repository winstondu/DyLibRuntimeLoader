<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="500" viewBox="0 0 900 500" font-family="-apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The golden rule: exactly one copy of each interface per process</title>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <style>
    .t { fill: #0f172a; }
    .muted { fill: #475569; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1e293b; white-space: pre; }
    .h { font-weight: 700; }
  </style>

  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <text x="20" y="36" class="t h" font-size="20">The golden rule: one copy of each interface per process</text>
  <text x="20" y="58" class="muted" font-size="13">The loader compares type identity, not names. Two copies of an interface mean two different spec types.</text>

  <!-- ============ LEFT: correct ============ -->
  <rect x="20" y="76" width="420" height="404" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="36" y="100" fill="#15803d" class="h" font-size="14">Correct: interface is one shared dynamic framework</text>

  <rect x="36" y="116" width="180" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="52" y="140" class="t h" font-size="14">Host app</text>
  <text x="52" y="162" class="muted" font-size="12">asks for spec type S:</text>
  <text x="52" y="178" class="code">AnimalPluginSpec</text>

  <rect x="244" y="116" width="180" height="70" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="260" y="140" class="t h" font-size="14">AnimalImplementation</text>
  <text x="260" y="162" class="muted" font-size="12">plugin entry reports:</text>
  <text x="260" y="178" class="code">entry.specType</text>

  <line x1="126" y1="186" x2="186" y2="224" stroke="#047857" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="334" y1="186" x2="274" y2="224" stroke="#047857" stroke-width="2" marker-end="url(#arrG)"/>

  <rect x="90" y="226" width="280" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="230" y="250" class="t h" font-size="14" text-anchor="middle">AnimalInterface.framework</text>
  <text x="230" y="270" class="muted" font-size="12" text-anchor="middle">one image, loaded once by dyld</text>
  <text x="230" y="290" class="code" text-anchor="middle">AnimalPluginSpec metadata (x1)</text>

  <rect x="36" y="328" width="388" height="138" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="52" y="350" class="muted" font-size="12">loadWithHandle(_:from:)</text>
  <text x="52" y="374" class="code">ObjectIdentifier(entry.specType)</text>
  <text x="52" y="392" class="code">  == ObjectIdentifier(S.self)</text>
  <text x="52" y="420" fill="#15803d" class="h" font-size="14">Passes: same metadata pointer</text>
  <text x="52" y="442" class="muted" font-size="12">entry.makeInstance() is returned as any Animal</text>

  <!-- ============ RIGHT: wrong ============ -->
  <rect x="460" y="76" width="420" height="404" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="476" y="100" fill="#b91c1c" class="h" font-size="14">Wrong: interface statically duplicated</text>

  <rect x="476" y="116" width="180" height="140" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="492" y="140" class="t h" font-size="14">Host app</text>
  <rect x="488" y="154" width="156" height="88" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="500" y="176" class="t h" font-size="12">AnimalInterface</text>
  <text x="500" y="194" class="muted" font-size="12">static copy A</text>
  <text x="500" y="218" class="code">AnimalPluginSpec</text>
  <text x="500" y="234" class="muted" font-size="11">metadata @ address A</text>

  <rect x="684" y="116" width="180" height="140" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="700" y="140" class="t h" font-size="14">AnimalImplementation</text>
  <rect x="696" y="154" width="156" height="88" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="708" y="176" class="t h" font-size="12">AnimalInterface</text>
  <text x="708" y="194" class="muted" font-size="12">static copy B</text>
  <text x="708" y="218" class="code">AnimalPluginSpec</text>
  <text x="708" y="234" class="muted" font-size="11">metadata @ address B</text>

  <text x="670" y="208" fill="#b91c1c" class="h" font-size="22" text-anchor="middle">&#8800;</text>
  <text x="670" y="284" class="muted" font-size="12" text-anchor="middle">same name, two distinct type metadata records</text>
  <text x="670" y="302" class="muted" font-size="12" text-anchor="middle">(one per image that embedded the interface)</text>

  <rect x="476" y="328" width="388" height="138" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="492" y="350" class="muted" font-size="12">loadWithHandle(_:from:)</text>
  <text x="492" y="374" class="code">ObjectIdentifier(entry.specType)</text>
  <text x="492" y="392" class="code">  != ObjectIdentifier(S.self)</text>
  <text x="492" y="420" class="code" style="fill:#b91c1c">throw DyLibError.specTypeMismatch(</text>
  <text x="492" y="438" class="code" style="fill:#b91c1c">  expected: "AnimalPluginSpec",</text>
  <text x="492" y="456" class="code" style="fill:#b91c1c">  found: "AnimalPluginSpec")</text>
</svg>
