<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="t d">
  <title id="t">What the three v2 macros generate</title>
  <desc id="d">@DyLibInterface, @DyLibExport and @DyLibConnect each expand into code; the interface spec and the plugin export meet at one derived C symbol, __dylib_entry_Animal.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf3989"/>
    </marker>
    <style>
      .p { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #1f2328; white-space: pre; }
      .dim { fill: #57606a; }
      .sym { fill: #bf3989; font-weight: 700; }
      .kw { fill: #8250df; }
      .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; fill: #57606a; }
      .hdr { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .note { font-size: 12px; fill: #424a53; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <text class="p" x="500" y="34" text-anchor="middle" font-size="20" font-weight="700">Three macros, one derived symbol</text>
  <text class="p note" x="500" y="56" text-anchor="middle">What each v2 macro expands to, and where the interface module, the plugin and the client meet</text>

  <!-- ============ Column 1: Interface module ============ -->
  <rect x="20" y="76" width="300" height="30" rx="6" fill="#0969da"/>
  <text class="p hdr" x="170" y="96" text-anchor="middle">Interface module</text>

  <text class="p lbl" x="22" y="126">YOU WRITE</text>
  <rect x="20" y="134" width="300" height="70" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="m" x="32" y="158"><tspan class="kw">@DyLibInterface</tspan></text>
  <text class="m" x="32" y="175">protocol Animal {</text>
  <text class="m" x="32" y="192">  func speak() -&gt; String }</text>

  <line x1="170" y1="208" x2="170" y2="236" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="p note" x="180" y="226">expands to</text>

  <text class="p lbl" x="22" y="252">GENERATED</text>
  <rect x="20" y="260" width="300" height="160" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="m" x="32" y="284"><tspan class="kw">enum</tspan> AnimalPluginSpec: DyLibPluginSpec</text>
  <text class="m" x="32" y="301">  symbolName <tspan class="sym">"__dylib_entry_Animal"</tspan></text>
  <text class="m" x="32" y="318">  load(from:) -&gt; any Animal</text>
  <text class="m" x="32" y="335">  loadWithHandle(from:)</text>
  <text class="m" x="32" y="352">    -&gt; (instance:, handle:)</text>
  <text class="m" x="32" y="376"><tspan class="kw">struct</tspan> AnimalLazyProxy: Animal</text>
  <text class="m dim" x="32" y="393">  forwards every requirement;</text>
  <text class="m dim" x="32" y="410">  resolves the plugin on first call</text>

  <text class="p note" x="22" y="442">The spec owns the symbol name. Both other</text>
  <text class="p note" x="22" y="458">columns reference AnimalPluginSpec.</text>

  <!-- ============ Column 2: Plugin ============ -->
  <rect x="350" y="76" width="300" height="30" rx="6" fill="#1a7f37"/>
  <text class="p hdr" x="500" y="96" text-anchor="middle">Plugin (dylib / framework)</text>

  <text class="p lbl" x="352" y="126">YOU WRITE</text>
  <rect x="350" y="134" width="300" height="70" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="m" x="362" y="158"><tspan class="kw">@DyLibExport</tspan>(Animal.self)</text>
  <text class="m" x="362" y="175">struct Dog: Animal {</text>
  <text class="m" x="362" y="192">  func speak() -&gt; String { "Woof" } }</text>

  <line x1="500" y1="208" x2="500" y2="236" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="p note" x="510" y="226">expands to</text>

  <text class="p lbl" x="352" y="252">GENERATED</text>
  <rect x="350" y="260" width="300" height="160" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="m" x="362" y="284"><tspan class="kw">@_cdecl</tspan>(<tspan class="sym">"__dylib_entry_Animal"</tspan>)</text>
  <text class="m" x="362" y="301"><tspan class="kw">public func</tspan> __dylib_export_Dog()</text>
  <text class="m" x="362" y="318">    -&gt; UnsafeMutableRawPointer {</text>
  <text class="m" x="362" y="335">  dyLibMakeEntry(</text>
  <text class="m" x="362" y="352">    spec: AnimalPluginSpec.self,</text>
  <text class="m" x="362" y="369">    factory: { Dog() as any Animal })</text>
  <text class="m" x="362" y="386">}</text>

  <text class="p note" x="352" y="442">One exported C entry point per plugin type;</text>
  <text class="p note" x="352" y="458">the factory is boxed behind the spec.</text>

  <!-- ============ Column 3: Client ============ -->
  <rect x="680" y="76" width="300" height="30" rx="6" fill="#8250df"/>
  <text class="p hdr" x="830" y="96" text-anchor="middle">Client (app)</text>

  <text class="p lbl" x="682" y="126">YOU WRITE</text>
  <rect x="680" y="134" width="300" height="70" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="m" x="692" y="158"><tspan class="kw">@DyLibConnect</tspan>(Animal.self,</text>
  <text class="m" x="692" y="175">  framework: "AnimalImplementation")</text>
  <text class="m" x="692" y="192">enum DogPlugin {}</text>

  <line x1="830" y1="208" x2="830" y2="236" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="p note" x="840" y="226">expands to</text>

  <text class="p lbl" x="682" y="252">GENERATED</text>
  <rect x="680" y="260" width="300" height="160" rx="6" fill="#fbefff" stroke="#c297ff"/>
  <text class="m" x="692" y="284"><tspan class="kw">static var</tspan> library: DyLibLibrary</text>
  <text class="m dim" x="692" y="301">  .framework("AnimalImplementation", …)</text>
  <text class="m" x="692" y="318"><tspan class="kw">static var</tspan> instance: any Animal</text>
  <text class="m dim" x="692" y="335">  AnimalLazyProxy { loadIfNeeded }</text>
  <text class="m" x="692" y="352"><tspan class="kw">static func</tspan> loadIfNeeded() throws</text>
  <text class="m" x="692" y="369"><tspan class="kw">static var</tspan> isLoaded: Bool</text>
  <text class="m" x="692" y="393"><tspan class="kw">extension</tspan> DogPlugin:</text>
  <text class="m" x="692" y="410">  DyLibPluginConnection</text>

  <text class="p note" x="682" y="442">No symbol argument: the lazy loader dlsyms</text>
  <text class="p note" x="682" y="458">AnimalPluginSpec.symbolName on first use.</text>

  <!-- ============ Convergence ============ -->
  <path d="M170,470 C170,500 250,512 318,512" fill="none" stroke="#bf3989" stroke-width="1.8" marker-end="url(#arrS)"/>
  <path d="M500,470 L500,490" fill="none" stroke="#bf3989" stroke-width="1.8" marker-end="url(#arrS)"/>
  <path d="M830,470 C830,500 750,512 682,512" fill="none" stroke="#bf3989" stroke-width="1.8" marker-end="url(#arrS)"/>
  <text class="p note" x="160" y="502" text-anchor="end">declares</text>
  <text class="p note" x="510" y="486">exports</text>
  <text class="p note" x="840" y="502">looks up</text>

  <rect x="320" y="492" width="360" height="62" rx="10" fill="#ffeff7" stroke="#bf3989" stroke-width="2"/>
  <text class="m sym" x="500" y="520" text-anchor="middle" font-size="18">__dylib_entry_Animal</text>
  <text class="p note" x="500" y="542" text-anchor="middle">the single C symbol both sides agree on</text>

  <!-- ============ Rule ============ -->
  <rect x="20" y="578" width="960" height="122" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="p" x="40" y="604" font-size="14" font-weight="700">Derived at compile time, never hand-typed</text>
  <text class="p note" x="40" y="626">@DyLibInterface and @DyLibExport both call the same function, PluginNaming.symbolName(for:version:):</text>
  <text class="m" x="40" y="650" font-size="13">"__dylib_entry_" + ProtocolName + (version == 1 ? "" : "_v\(version)")</text>
  <text class="p note" x="40" y="676">version defaults to 1 (no suffix). @DyLibInterface(version: 2) gives __dylib_entry_Animal_v2, and the plugin</text>
  <text class="p note" x="40" y="692">must say @DyLibExport(Animal.self, version: 2) to match; a mismatch fails at load with symbolNotFound.</text>
</svg>
