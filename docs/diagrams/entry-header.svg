<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1046" viewBox="0 0 1000 1046" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>DyLibEntryHeader: the C-layout boundary contract and host validation</title>
<style>
  .t { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .st { font-size: 13px; fill: #475569; }
  .sec { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; }
  .hd { font-size: 15px; font-weight: 700; fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .c { font-size: 12.5px; fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .cb { font-size: 12.5px; font-weight: 700; fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .cs { font-size: 11.5px; fill: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .off { font-size: 11px; fill: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .p { font-size: 12.5px; fill: #334155; }
  .pi { font-size: 12px; fill: #64748b; font-style: italic; }
  .yn { font-size: 11.5px; font-weight: 700; fill: #475569; }
  .ok { font-size: 13px; font-weight: 700; fill: #065f46; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .err { font-size: 13px; font-weight: 700; fill: #991b1b; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
</defs>
<rect width="1000" height="1046" fill="#ffffff"/>
<text class="t" x="24" y="38">DyLibEntryHeader: the boundary contract</text>
<text class="st" x="24" y="60">What a plugin entry point returns, and how the host checks it with raw loads before trusting any Swift type.</text>
<text class="sec" x="24" y="98">1  PLUGIN SIDE: @_cdecl("__dylib_entry_Animal") -> dyLibMakeEntry(spec:factory:)</text>
<rect x="24" y="114" width="470" height="214" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text class="hd" x="40" y="142">@frozen struct DyLibEntryHeader</text>
<text class="pi" x="40" y="162">heap-allocated by dyLibMakeEntry; ownership passes to the host</text>
<text class="off" x="40" y="205">+0</text>
<rect x="70" y="178" width="408" height="42" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
<text class="cb" x="82" y="196">magic: <tspan class="c" font-weight="400">UInt32</tspan></text>
<text class="cs" x="82" y="212">= 0x44594C42  "DYLB"</text>
<text class="off" x="40" y="253">+4</text>
<rect x="70" y="226" width="408" height="42" rx="5" fill="#e0e7ff" stroke="#6366f1"/>
<text class="cb" x="82" y="244">abiVersion: <tspan class="c" font-weight="400">Int32</tspan></text>
<text class="cs" x="82" y="260">= DyLibABI.current  (= 1)</text>
<text class="off" x="40" y="301">+8</text>
<rect x="70" y="274" width="408" height="42" rx="5" fill="#dcfce7" stroke="#16a34a"/>
<text class="cb" x="82" y="292">box: <tspan class="c" font-weight="400">UnsafeMutableRawPointer</tspan></text>
<text class="cs" x="82" y="308">opaque +1 reference to the entry object</text>
<rect x="580" y="150" width="396" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text class="hd" x="596" y="178">final class DyLibPluginEntry</text>
<text class="pi" x="596" y="198">Unmanaged.passRetained(...).toOpaque()</text>
<text class="cb" x="596" y="228">specType: <tspan class="c" font-weight="400">Any.Type</tspan></text>
<text class="cs" x="612" y="246">= AnimalPluginSpec.self</text>
<text class="cb" x="596" y="270">makeInstance: <tspan class="c" font-weight="400">() -&gt; Any</tspan></text>
<text class="cs" x="612" y="288">= { Dog() as any Animal }</text>
<path d="M478 295 H576" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ar)"/>
<text class="pi" x="537.0" y="287" text-anchor="middle">retained</text>
<text class="pi" x="580" y="326">Only the 16-byte header crosses as C data;</text>
<text class="pi" x="580" y="344">box is not read as Swift until the header passes.</text>
<text class="sec" x="24" y="380">2  HOST SIDE: DyLibLoader.loadWithHandle validation ladder</text>
<rect x="24" y="398" width="520" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text class="c" xml:space="preserve" x="40" y="421">rawHeader = entry()    // UnsafeMutableRawPointer</text>
<path d="M84 434 V458" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="24" y="460" width="520" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<path d="M24 468 v46" stroke="#d97706" stroke-width="5"/>
<text class="cb" x="42" y="488">magic == 0x44594C42 ?</text>
<text class="pi" x="42" y="507">raw UInt32 load at byte offset 0, before any Swift cast</text>
<rect x="610" y="454" width="366" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text class="err" x="626" y="478">throw .invalidEntry(symbol:path:)</text>
<text class="p" x="626" y="498">header is NOT freed: without the magic it is</text>
<text class="p" x="626" y="516">not memory this runtime allocated</text>
<path d="M544 491.0 H606" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arR)"/>
<text class="yn" x="556" y="484.0">no</text>
<path d="M84 522 V546" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="yn" x="94" y="539.0">yes</text>
<rect x="24" y="548" width="520" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text class="c" xml:space="preserve" x="40" y="571">load abiVersion (+4) and box (+8)</text>
<text class="c" xml:space="preserve" x="40" y="589">rawHeader.deallocate()   // all fields read</text>
<path d="M84 602 V626" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="24" y="628" width="520" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<path d="M24 636 v30" stroke="#d97706" stroke-width="5"/>
<text class="cb" x="42" y="656">abiVersion == DyLibABI.current ?</text>
<rect x="610" y="614" width="366" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text class="err" x="626" y="638">throw .abiMismatch(expected:found:)</text>
<text class="p" x="626" y="658">Unmanaged.fromOpaque(box).release() first,</text>
<text class="p" x="626" y="676">so the entry object does not leak</text>
<path d="M544 651.0 H606" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arR)"/>
<text class="yn" x="556" y="644.0">no</text>
<path d="M84 674 V698" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="yn" x="94" y="691.0">yes</text>
<rect x="24" y="700" width="520" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text class="c" xml:space="preserve" x="40" y="723">entry = Unmanaged&lt;DyLibPluginEntry&gt;</text>
<text class="c" xml:space="preserve" x="40" y="741">          .fromOpaque(box).takeRetainedValue()</text>
<path d="M84 754 V778" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="24" y="780" width="520" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<path d="M24 788 v46" stroke="#d97706" stroke-width="5"/>
<text class="cb" x="42" y="808">ObjectIdentifier(entry.specType) ==</text>
<text class="cb" xml:space="preserve" x="42" y="826">ObjectIdentifier(AnimalPluginSpec.self) ?</text>
<rect x="610" y="766" width="366" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text class="err" x="626" y="790">throw .specTypeMismatch(expected:found:)</text>
<text class="p" x="626" y="810">interface module statically duplicated, or</text>
<text class="p" x="626" y="828">plugin built against another interface</text>
<path d="M544 811.0 H606" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arR)"/>
<text class="yn" x="556" y="804.0">no</text>
<path d="M84 842 V866" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="yn" x="94" y="859.0">yes</text>
<rect x="24" y="868" width="520" height="46" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
<path d="M24 876 v30" stroke="#d97706" stroke-width="5"/>
<text class="cb" x="42" y="896">entry.makeInstance() as? any Animal ?</text>
<rect x="610" y="862" width="366" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text class="err" x="626" y="886">throw .specTypeMismatch(expected:found:)</text>
<text class="p" x="626" y="906">factory produced the wrong type</text>
<path d="M544 891.0 H606" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arR)"/>
<text class="yn" x="556" y="884.0">no</text>
<path d="M84 914 V938" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text class="yn" x="94" y="931.0">yes</text>
<rect x="24" y="940" width="520" height="44" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text class="ok" x="46" y="967">return (instance, handle)</text>
<text class="pi" x="24" y="1018">Any throw after open(): loadWithHandle catches, calls close(handle) to drop the registry references it took, and rethrows.</text>
</svg>
