<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="962" viewBox="0 0 900 962" font-family="-apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Linked vs. loaded: how DyLibRuntimeLoader lays out an iOS app bundle</title>
  <defs>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arr-rt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0072b2"/>
    </marker>
    <marker id="arr-dl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cc79a7"/>
    </marker>
    <marker id="arr-tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#009e73"/>
    </marker>
    <marker id="arr-app" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .t { fill: #0f172a; }
    .muted { fill: #475569; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1e293b; white-space: pre; }
    .code-sm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1e293b; white-space: pre; }
    .h { font-weight: 700; }
  </style>

  <rect x="0" y="0" width="900" height="962" fill="#ffffff"/>

  <text x="20" y="36" class="t h" font-size="20">Linked vs. loaded</text>
  <text x="20" y="58" class="muted" font-size="13">Interfaces are linked at launch; implementations ship in the bundle but are only dlopen'd when first used.</text>

  <!-- App bundle -->
  <rect x="20" y="76" width="860" height="796" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="36" y="99" class="t h" font-size="14">DynamicLoadingDemo.app</text>

  <!-- Legend -->
  <text x="300" y="99" class="muted" font-size="11">dyld link, colored by the framework it targets:</text>
  <line x1="560" y1="95" x2="580" y2="95" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-rt)"/>
  <line x1="590" y1="95" x2="610" y2="95" stroke="#0072b2" stroke-width="1.5" marker-end="url(#arr-an)"/>
  <line x1="620" y1="95" x2="640" y2="95" stroke="#cc79a7" stroke-width="2" marker-end="url(#arr-dl)"/>
  <line x1="650" y1="95" x2="670" y2="95" stroke="#009e73" stroke-width="1.5" marker-end="url(#arr-tr)"/>
  <line x1="722" y1="95" x2="750" y2="95" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <text x="756" y="99" fill="#c2410c" font-size="11">dlopen on first use</text>

  <!-- App executable -->
  <rect x="40" y="110" width="820" height="136" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="56" y="133" class="t h" font-size="14">App executable</text>
  <text x="170" y="133" class="muted" font-size="12">ViewController.swift</text>
  <text x="56" y="156" class="code">import AnimalInterface</text>
  <text x="56" y="174" class="code">import DemoLogging</text>
  <text x="56" y="192" class="code">import DyLibRuntimeLoader</text>
  <text x="56" y="214" class="code">@DyLibConnect(Animal.self, framework: "CatImplementation", logger: DebugLogger.self)</text>
  <text x="56" y="232" class="code">enum CatPlugin {}     // likewise MousePlugin, DogPlugin; a tap calls .instance.speak()</text>
  <text x="560" y="156" class="t h" font-size="13">Imports interfaces and DemoLogging only.</text>
  <text x="560" y="176" class="muted" font-size="12">The app never imports or links an implementation;</text>
  <text x="560" y="194" class="muted" font-size="12">it names each framework only as a string.</text>

  <!-- dyld link arrow: the app's own links -->
  <line x1="100" y1="246" x2="100" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arr-app)"/>
  <text x="108" y="276" fill="#475569" font-size="12">linked by dyld</text>

  <!-- Linked band -->
  <rect x="32" y="292" width="836" height="140" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>

  <rect x="40" y="324" width="186" height="76" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="54" y="348" class="t h" font-size="15">DyLibRuntimeLoader</text>
  <text x="54" y="368" class="muted" font-size="12">macros + dlopen loader</text>
  <text x="54" y="386" class="muted" font-size="12">refcounted handles</text>

  <rect x="242" y="324" width="186" height="76" rx="8" fill="#ffffff" stroke="#0072b2" stroke-width="2"/>
  <text x="256" y="348" class="t h" font-size="15">AnimalInterface</text>
  <text x="256" y="368" class="code">@DyLibInterface</text>
  <text x="256" y="386" class="code">public protocol Animal</text>

  <rect x="444" y="324" width="186" height="76" rx="8" fill="#ffffff" stroke="#cc79a7" stroke-width="2"/>
  <text x="458" y="348" class="t h" font-size="15">DemoLogging</text>
  <text x="458" y="368" class="code">enum DebugLogger:</text>
  <text x="458" y="386" class="code">  DyLibLoadLogger</text>

  <rect x="646" y="324" width="186" height="76" rx="8" fill="#ffffff" stroke="#009e73" stroke-width="2"/>
  <text x="660" y="348" class="t h" font-size="15">TrickInterface</text>
  <text x="660" y="368" class="code">@DyLibInterface</text>
  <text x="660" y="386" class="code">public protocol Trick</text>

  <!-- Embedded band -->
  <rect x="32" y="482" width="836" height="376" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" stroke-dasharray="7 4"/>

  <!-- Lazy dlopen arrows from the app to each animal, through the gaps between linked boxes -->
  <path d="M234,246 L234,504" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <path d="M436,246 L436,504" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <path d="M638,246 L638,504" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>

  <!-- Plugin dyld links. Straight up where a plugin sits under its target; Cat and Trick
       share a lane to DyLibRuntimeLoader and to TrickInterface; Dog reaches
       DyLibRuntimeLoader and AnimalInterface around the right side and over the top.
       Arcs mark crossings that are not junctions. -->
  <path d="M80,506 L80,402" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-rt)"/>
  <path d="M270,506 L270,402" fill="none" stroke="#0072b2" stroke-width="1.5" marker-end="url(#arr-an)"/>
  <path d="M400,506 L400,402" fill="none" stroke="#0072b2" stroke-width="1.5" marker-end="url(#arr-an)"/>
  <path d="M520,506 L520,402" fill="none" stroke="#cc79a7" stroke-width="2" marker-end="url(#arr-dl)"/>
  <path d="M600,506 L600,402" fill="none" stroke="#cc79a7" stroke-width="2" marker-end="url(#arr-dl)"/>
  <path d="M780,506 L780,402" fill="none" stroke="#009e73" stroke-width="1.5" marker-end="url(#arr-tr)"/>
  <path d="M320,506 L320,460 L276,460 A6,6 0 0 0 264,460 L160,460 L160,402" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-rt)"/>
  <path d="M380,790 L300,790 L300,460" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="300" cy="460" r="2.5" fill="#1e293b"/>
  <path d="M540,506 L540,460 L594,460 A6,6 0 0 1 606,460 L700,460 L700,402" fill="none" stroke="#009e73" stroke-width="1.5" marker-end="url(#arr-tr)"/>
  <path d="M562,724 L562,460" fill="none" stroke="#009e73" stroke-width="1.5"/>
  <circle cx="562" cy="460" r="2.5" fill="#009e73"/>
  <path d="M818,590 L846,590 L846,278 L410,278 L410,322" fill="none" stroke="#0072b2" stroke-width="1.5" marker-end="url(#arr-an)"/>
  <path d="M818,610 L858,610 L858,262 L200,262 L200,322" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-rt)"/>

  <rect x="456" y="300" width="378" height="18" fill="#ecfdf5"/>
  <text x="830" y="313" fill="#047857" class="h" font-size="13" text-anchor="end">Dynamically LINKED: dyld loads these before main()</text>
  <text x="48" y="846" fill="#c2410c" class="h" font-size="13">EMBEDDED in Frameworks/, NOT linked by the app: dlopen on first use</text>

  <!-- Mouse -->
  <rect x="44" y="506" width="250" height="170" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="58" y="529" class="t h" font-size="13">MouseImplementation.framework</text>
  <text x="58" y="546" fill="#c2410c" font-size="11">dlopen'd on first MousePlugin use</text>
  <text x="58" y="568" class="code-sm">@DyLibExport(Animal.self)</text>
  <text x="58" y="586" class="code-sm">public struct Mouse: Animal</text>
  <text x="58" y="610" class="muted" font-size="12">speak() returns "Squeak!"</text>
  <text x="58" y="628" class="muted" font-size="12">no connections of its own</text>

  <!-- Cat -->
  <rect x="306" y="506" width="250" height="170" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="320" y="529" class="t h" font-size="13">CatImplementation.framework</text>
  <text x="320" y="546" fill="#c2410c" font-size="11">dlopen'd on first CatPlugin use</text>
  <text x="320" y="568" class="code-sm">@DyLibExport(Animal.self)</text>
  <text x="320" y="586" class="code-sm">public struct Cat: Animal</text>
  <text x="320" y="610" class="code-sm">@DyLibConnect(Trick.self,</text>
  <text x="320" y="626" class="code-sm">  framework: "TrickImplementation",</text>
  <text x="320" y="642" class="code-sm">  logger: DebugLogger.self)</text>
  <text x="320" y="658" class="code-sm">enum TrickPlugin {}</text>

  <!-- Dog -->
  <rect x="568" y="506" width="250" height="170" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="582" y="529" class="t h" font-size="13">DogImplementation.framework</text>
  <text x="582" y="546" fill="#c2410c" font-size="11">dlopen'd on first DogPlugin use</text>
  <text x="582" y="568" class="code-sm">@DyLibExport(Animal.self)</text>
  <text x="582" y="586" class="code-sm">public struct Dog: Animal</text>
  <text x="582" y="610" class="code-sm">@DyLibConnect(Trick.self,</text>
  <text x="582" y="626" class="code-sm">  framework: "TrickImplementation",</text>
  <text x="582" y="642" class="code-sm">  logger: DebugLogger.self)</text>
  <text x="582" y="658" class="code-sm">enum TrickPlugin {}</text>

  <!-- plugin -> plugin -->
  <path d="M470,676 L470,722" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <path d="M720,676 L720,722" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>

  <!-- Trick -->
  <rect x="380" y="724" width="438" height="96" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="396" y="748" class="t h" font-size="15">TrickImplementation.framework</text>
  <text x="396" y="765" fill="#c2410c" font-size="11">dlopen'd on first TrickPlugin use, from Cat.speak() or Dog.speak()</text>
  <text x="396" y="788" class="code">@DyLibExport(Trick.self)</text>
  <text x="396" y="806" class="code">public struct Backflip: Trick</text>
  <text x="618" y="788" class="muted" font-size="12">perform() returns "backflip"</text>
  <text x="618" y="806" class="muted" font-size="12">one image for Cat and Dog</text>

  <!-- Logging note -->
  <text x="62" y="706" class="t h" font-size="12">Debug builds:</text>
  <text x="62" y="724" class="muted" font-size="12">DebugLogger prints one</text>
  <text x="62" y="742" class="muted" font-size="12">line per real load (each</text>
  <text x="62" y="760" class="muted" font-size="12">connection's first use).</text>
  <text x="62" y="778" class="muted" font-size="12">Release prints nothing.</text>

  <text x="20" y="896" fill="#b91c1c" font-size="12" class="h">If any framework in the linked band is missing, dyld aborts and the app won't launch.</text>
  <text x="20" y="914" class="muted" font-size="12">Each plugin's dyld links resolve via @rpath (@executable_path/Frameworks) to the copies the app already loaded, so each shared</text>
  <text x="20" y="930" class="muted" font-size="12">module exists once per process. All eight frameworks are in the Embed Frameworks phase; the app itself links only the two interfaces,</text>
  <text x="20" y="946" class="muted" font-size="12">DemoLogging and the runtime.</text>
</svg>
