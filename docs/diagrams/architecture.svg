<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="680" viewBox="0 0 900 680" font-family="-apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Linked vs. loaded: how DyLibRuntimeLoader lays out an iOS app bundle</title>
  <defs>
    <marker id="arrSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <style>
    .t { fill: #0f172a; }
    .muted { fill: #475569; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1e293b; white-space: pre; }
    .h { font-weight: 700; }
  </style>

  <rect x="0" y="0" width="900" height="680" fill="#ffffff"/>

  <text x="20" y="36" class="t h" font-size="20">Linked vs. loaded</text>
  <text x="20" y="58" class="muted" font-size="13">Interfaces are linked at launch; implementations ship in the bundle but are only dlopen'd when first used.</text>

  <!-- App bundle -->
  <rect x="20" y="76" width="860" height="556" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="36" y="99" class="t h" font-size="14">DynamicLoadingDemo.app</text>

  <!-- App executable -->
  <rect x="40" y="110" width="820" height="112" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="56" y="133" class="t h" font-size="14">App executable</text>
  <text x="170" y="133" class="muted" font-size="12">ViewController.swift</text>
  <text x="56" y="156" class="code">import AnimalInterface</text>
  <text x="56" y="174" class="code">import DyLibRuntimeLoader</text>
  <text x="56" y="194" class="code">@DyLibConnect(Animal.self, framework: "AnimalImplementation")</text>
  <text x="56" y="212" class="code">enum DogPlugin {}      // ... DogPlugin.instance.speak()</text>
  <text x="590" y="156" class="t h" font-size="13">Imports interfaces only.</text>
  <text x="590" y="176" class="muted" font-size="12">The app never imports or links</text>
  <text x="590" y="194" class="muted" font-size="12">AnimalImplementation; it names the</text>
  <text x="590" y="212" class="muted" font-size="12">framework only as a string.</text>

  <!-- dyld link arrow -->
  <line x1="450" y1="222" x2="450" y2="248" stroke="#047857" stroke-width="2" marker-end="url(#arrSolid)"/>
  <text x="460" y="240" fill="#047857" font-size="12">linked by dyld</text>

  <!-- Linked band -->
  <rect x="32" y="250" width="836" height="146" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="852" y="271" fill="#047857" class="h" font-size="13" text-anchor="end">Dynamically LINKED: dyld loads these before main()</text>

  <rect x="40" y="282" width="250" height="78" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="56" y="306" class="t h" font-size="15">DyLibRuntimeLoader</text>
  <text x="56" y="326" class="muted" font-size="12">macro runtime + dlopen loader</text>
  <text x="56" y="344" class="muted" font-size="12">refcounted handles</text>

  <rect x="325" y="282" width="250" height="78" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="341" y="306" class="t h" font-size="15">AnimalInterface</text>
  <text x="341" y="326" class="code">@DyLibInterface</text>
  <text x="341" y="344" class="code">public protocol Animal</text>

  <rect x="610" y="282" width="250" height="78" rx="8" fill="#ffffff" stroke="#10b981"/>
  <text x="626" y="306" class="t h" font-size="15">TrickInterface</text>
  <text x="626" y="326" class="code">@DyLibInterface</text>
  <text x="626" y="344" class="code">public protocol Trick</text>

  <text x="330" y="383" fill="#b91c1c" font-size="12" class="h">Missing any one of these: dyld aborts and the app won't launch.</text>


  <!-- Embedded band -->
  <rect x="32" y="422" width="836" height="198" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="852" y="443" fill="#c2410c" class="h" font-size="13" text-anchor="end">EMBEDDED in Frameworks/, NOT linked: dlopen on first use</text>

  <rect x="48" y="456" width="330" height="150" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="64" y="480" class="t h" font-size="15">AnimalImplementation.framework</text>
  <text x="64" y="504" class="code">@DyLibExport(Animal.self)</text>
  <text x="64" y="522" class="code">public struct Dog: Animal</text>
  <text x="64" y="548" class="code">@DyLibConnect(Trick.self,</text>
  <text x="64" y="566" class="code">  framework: "TrickImplementation")</text>
  <text x="64" y="584" class="code">enum TrickPlugin {}</text>

  <rect x="522" y="456" width="330" height="150" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="538" y="480" class="t h" font-size="15">TrickImplementation.framework</text>
  <text x="538" y="504" class="code">@DyLibExport(Trick.self)</text>
  <text x="538" y="522" class="code">public struct Backflip: Trick</text>
  <text x="538" y="548" class="muted" font-size="12">perform() returns "backflip"</text>

  <!-- Lazy dlopen arrow from app to AnimalImplementation, through the gap between boxes -->
  <path d="M307,222 L307,454" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <text x="317" y="413" fill="#c2410c" font-size="12">dlopen on first DogPlugin.instance use</text>

  <!-- plugin -> plugin -->
  <line x1="380" y1="531" x2="518" y2="531" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <text x="450" y="520" fill="#c2410c" font-size="11" text-anchor="middle">lazy dlopen</text>
  <text x="450" y="549" fill="#c2410c" font-size="11" text-anchor="middle">plugin to plugin</text>
  <text x="450" y="563" fill="#c2410c" font-size="11" text-anchor="middle">(Dog.speak())</text>

  <text x="20" y="656" class="muted" font-size="12">Plugins link against the same AnimalInterface / TrickInterface images the app already loaded, so each interface exists</text>
  <text x="20" y="672" class="muted" font-size="12">once per process. All five frameworks are in the Embed Frameworks phase; only the interfaces and the runtime are linked.</text>
</svg>
