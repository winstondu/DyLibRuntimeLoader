<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1128" height="924" viewBox="0 0 1128 924" font-family="-apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Linked vs. loaded: how Dynasty lays out an iOS app bundle</title>
  <defs>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arr-rt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0072b2"/>
    </marker>
    <marker id="arr-dl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cc79a7"/>
    </marker>
    <marker id="arr-tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#009e73"/>
    </marker>
    <marker id="arr-app" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .t { fill: #0f172a; }
    .muted { fill: #475569; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1e293b; white-space: pre; }
    .code-sm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1e293b; white-space: pre; }
    .h { font-weight: 700; }
  </style>

  <rect x="0" y="0" width="1128" height="924" fill="#ffffff"/>

  <text x="20" y="36" class="t h" font-size="20">Linked vs. loaded</text>
  <text x="20" y="58" class="muted" font-size="13">Bands run top to bottom by dependency: the app dlopens plugins on first use; each image dyld-links the frameworks it uses when it loads.</text>

  <!-- App bundle -->
  <rect x="20" y="76" width="1088" height="776" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="36" y="99" class="t h" font-size="14">DynamicLoadingDemo.app</text>

  <!-- Legend -->
  <text x="372" y="99" class="muted" font-size="11">dyld link, colored by the framework it targets:</text>
  <line x1="626" y1="95" x2="648" y2="95" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-rt)"/>
  <line x1="656" y1="95" x2="678" y2="95" stroke="#0072b2" stroke-width="1.5" marker-end="url(#arr-an)"/>
  <line x1="686" y1="95" x2="708" y2="95" stroke="#cc79a7" stroke-width="2" marker-end="url(#arr-dl)"/>
  <line x1="716" y1="95" x2="738" y2="95" stroke="#009e73" stroke-width="1.5" marker-end="url(#arr-tr)"/>
  <line x1="756" y1="95" x2="778" y2="95" stroke="#64748b" stroke-width="2"/>
  <text x="784" y="99" class="muted" font-size="11">bundled</text>
  <line x1="866" y1="95" x2="894" y2="95" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <text x="900" y="99" fill="#c2410c" font-size="11">dlopen on first use</text>

  <!-- App executable -->
  <rect x="48" y="110" width="1032" height="136" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="64" y="133" class="t h" font-size="14">App executable</text>
  <text x="178" y="133" class="muted" font-size="12">ViewController.swift</text>
  <text x="64" y="156" class="code">import AnimalInterface</text>
  <text x="64" y="174" class="code">import DemoLogging</text>
  <text x="64" y="192" class="code">import Dynasty</text>
  <text x="64" y="214" class="code">@DyLibConnect(Animal.self, framework: "CatImplementation", logger: DebugLogger.self)</text>
  <text x="64" y="232" class="code">enum CatPlugin {}     // likewise MousePlugin, DogPlugin; a tap calls .instance.speak()</text>
  <text x="700" y="156" class="t h" font-size="13">Imports AnimalInterface and DemoLogging only.</text>
  <text x="700" y="176" class="muted" font-size="12">The app never imports or links an implementation;</text>
  <text x="700" y="194" class="muted" font-size="12">it names each framework only as a string.</text>

  <!-- Embedded band: plugins -->
  <rect x="100" y="272" width="988" height="334" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="1076" y="292" fill="#c2410c" class="h" font-size="12" text-anchor="end">EMBEDDED, loaded on first use</text>

  <!-- Cat and Dog bracket -->
  <rect x="346" y="292" width="438" height="170" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="358" y="455" class="muted" font-size="11">same links, drawn once</text>

  <rect x="114" y="304" width="220" height="132" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="126" y="328" class="t h" font-size="11.5">MouseImplementation.framework</text>
  <text x="126" y="345" fill="#c2410c" font-size="11">dlopen'd on first MousePlugin use</text>
  <text x="126" y="367" class="code-sm">@DyLibExport(Animal.self)</text>
  <text x="126" y="385" class="code-sm">public struct Mouse: Animal</text>
  <text x="126" y="401" class="muted" font-size="11">speak() returns "Squeak!"</text>
  <text x="126" y="417" class="muted" font-size="11">no connections of its own</text>
  <rect x="356" y="304" width="208" height="132" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="366" y="328" class="t h" font-size="11.5">CatImplementation.framework</text>
  <text x="366" y="345" fill="#c2410c" font-size="11">dlopen'd on first CatPlugin use</text>
  <text x="366" y="367" class="code-sm">@DyLibExport(Animal.self)</text>
  <text x="366" y="385" class="code-sm">public struct Cat: Animal</text>
  <text x="366" y="401" class="code-sm">@DyLibConnect(Trick.self, …)</text>
  <text x="366" y="417" class="code-sm">enum TrickPlugin {}</text>
  <rect x="568" y="304" width="208" height="132" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="578" y="328" class="t h" font-size="11.5">DogImplementation.framework</text>
  <text x="578" y="345" fill="#c2410c" font-size="11">dlopen'd on first DogPlugin use</text>
  <text x="578" y="367" class="code-sm">@DyLibExport(Animal.self)</text>
  <text x="578" y="385" class="code-sm">public struct Dog: Animal</text>
  <text x="578" y="401" class="code-sm">@DyLibConnect(Trick.self, …)</text>
  <text x="578" y="417" class="code-sm">enum TrickPlugin {}</text>
  <rect x="868" y="304" width="212" height="132" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="880" y="328" class="t h" font-size="11.5">TrickImplementation.framework</text>
  <text x="880" y="345" fill="#c2410c" font-size="11">dlopen'd on first TrickPlugin use</text>
  <text x="880" y="367" class="code-sm">@DyLibExport(Trick.self)</text>
  <text x="880" y="385" class="code-sm">public struct Backflip: Trick</text>
  <text x="880" y="401" class="muted" font-size="11">perform() returns "backflip"</text>
  <text x="880" y="417" class="muted" font-size="11">one image for Cat and Dog</text>

  <!-- dlopen: app -> Mouse, Cat, Dog; Cat/Dog -> Trick -->
  <path d="M224,246 L224,302" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <path d="M460,246 L460,302" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <path d="M670,246 L670,302" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <path d="M784,370 L866,370" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrDash)"/>
  <text x="825" y="349" fill="#c2410c" font-size="11" text-anchor="middle">each, on first</text>
  <text x="825" y="362" fill="#c2410c" font-size="11" text-anchor="middle">speak()</text>

  <!-- Plugin-only interface: embedded, never linked by the app -->
  <rect x="864" y="486" width="186" height="104" rx="8" fill="#ffffff" stroke="#009e73" stroke-width="2"/>
  <text x="878" y="510" class="t h" font-size="15">TrickInterface</text>
  <text x="878" y="530" class="code">@DyLibInterface</text>
  <text x="878" y="548" class="code">public protocol Trick</text>
  <text x="878" y="566" class="muted" font-size="11">not linked by the app; dyld</text>
  <text x="878" y="581" class="muted" font-size="11">maps it with Cat, Dog or Trick</text>

  <!-- Linked band -->
  <rect x="52" y="622" width="1036" height="210" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>

  <rect x="248" y="656" width="220" height="76" rx="8" fill="#ffffff" stroke="#0072b2" stroke-width="2"/>
  <text x="262" y="680" class="t h" font-size="15">AnimalInterface</text>
  <text x="262" y="700" class="code">@DyLibInterface</text>
  <text x="262" y="718" class="code">public protocol Animal</text>

  <rect x="500" y="656" width="148" height="76" rx="8" fill="#ffffff" stroke="#cc79a7" stroke-width="2"/>
  <text x="512" y="680" class="t h" font-size="15">DemoLogging</text>
  <text x="512" y="700" class="code">enum DebugLogger:</text>
  <text x="512" y="718" class="code">  DyLibLoadLogger</text>

  <text x="178" y="759" fill="#047857" class="h" font-size="12">LINKED, dyld loads these before main()</text>
  <text x="684" y="759" fill="#b91c1c" class="h" font-size="11">Missing one: dyld aborts and the app won't launch.</text>

  <!-- Runtime: full-width base -->
  <rect x="60" y="776" width="1020" height="40" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="178" y="801" class="t h" font-size="15">Dynasty</text>
  <text x="338" y="801" class="muted" font-size="12">macros + dlopen loader, refcounted handles; the base every framework above links</text>

  <!-- dyld links -->
  <path d="M158,436 L158,774" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-rt)"/>
  <path d="M288,436 L288,654" fill="none" stroke="#0072b2" stroke-width="1.5" marker-end="url(#arr-an)"/>
  <path d="M545,436 L545,448 L565,448" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M585,436 L585,448 L565,448" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M565,448 L565,482" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M565,470 L448,470 L448,654" fill="none" stroke="#0072b2" stroke-width="1.5" marker-end="url(#arr-an)"/>
  <path d="M565,470 L920,470 L920,484" fill="none" stroke="#009e73" stroke-width="1.5" marker-end="url(#arr-tr)"/>
  <path d="M565,482 L668,482 L668,774" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-rt)"/>
  <path d="M565,482 L565,654" fill="none" stroke="#cc79a7" stroke-width="2" marker-end="url(#arr-dl)"/>
  <circle cx="565" cy="448" r="3" fill="#64748b"/>
  <circle cx="565" cy="470" r="3" fill="#64748b"/>
  <circle cx="565" cy="482" r="3" fill="#64748b"/>
  <path d="M1010,436 L1010,484" fill="none" stroke="#009e73" stroke-width="1.5" marker-end="url(#arr-tr)"/>
  <path d="M1066,436 L1066,774" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-rt)"/>
  <path d="M76,246 L76,620" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-app)"/>

  <text x="20" y="876" class="muted" font-size="12">Each dyld link resolves via @rpath (@executable_path/Frameworks) to the copy already loaded, so each shared module exists once per process. The slate arrow</text>
  <text x="20" y="892" class="muted" font-size="12">on the left is the app's own links: AnimalInterface, DemoLogging and the runtime. All eight frameworks are embedded; the app links no plugin and not TrickInterface.</text>
  <text x="20" y="908" class="muted" font-size="12">Cat and Dog each declare @DyLibConnect(Trick.self, framework: "TrickImplementation", logger: DebugLogger.self). Debug builds log one line per real load via DebugLogger.</text>
</svg>
