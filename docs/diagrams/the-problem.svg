<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Everything you link is paid for before main()</title>
<style>
  .t { font-size: 20px; font-weight: 700; fill: #0f172a; }
  .ey { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #c2410c; }
  .hd { font-size: 16px; font-weight: 700; fill: #0f172a; }
  .bar { font-size: 13px; font-weight: 700; fill: #ffffff; }
  .ax { font-size: 12px; fill: #64748b; }
  .mn { font-size: 12px; fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .p { font-size: 13.5px; fill: #334155; }
  .k { font-size: 15px; font-weight: 700; fill: #c2410c; }
</style>
<rect width="1000" height="400" fill="#ffffff"/>
<text class="ey" x="24" y="34">THE PROBLEM</text>
<text class="t" x="24" y="62">Everything you link is paid for before main()</text>

<rect x="24" y="88" width="466" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text class="hd" x="48" y="122">Static linking</text>
<rect x="56" y="196" width="190" height="32" rx="4" fill="#475569"/>
<text class="bar" x="151" y="217" text-anchor="middle">app + feature</text>
<line x1="48" y1="238" x2="466" y2="238" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="266" y1="180" x2="266" y2="244" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="ax" x="48" y="258">launch</text>
<text class="mn" x="266" y="258" text-anchor="middle">main()</text>
<text class="ax" x="466" y="258" text-anchor="end">first use</text>
<text class="p" x="48" y="290">The feature's code is copied into the executable,</text>
<text class="p" x="48" y="309">so it loads with the app.</text>

<rect x="510" y="88" width="466" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text class="hd" x="534" y="122">Dynamic linking</text>
<rect x="542" y="196" width="90" height="32" rx="4" fill="#475569"/>
<text class="bar" x="587" y="217" text-anchor="middle">app</text>
<rect x="638" y="196" width="100" height="32" rx="4" fill="#c2410c"/>
<text class="bar" x="688" y="217" text-anchor="middle">dyld</text>
<line x1="534" y1="238" x2="952" y2="238" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="758" y1="180" x2="758" y2="244" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="ax" x="534" y="258">launch</text>
<text class="mn" x="758" y="258" text-anchor="middle">main()</text>
<text class="ax" x="952" y="258" text-anchor="end">first use</text>
<text class="p" x="534" y="290">A load command makes dyld map, rebase and bind the</text>
<text class="p" x="534" y="309">framework before main(), on every launch.</text>

<text class="k" x="24" y="368">Every linked feature costs launch time for every user, whether this session touches it or not.</text>
</svg>
